name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Live site or local setup? Browser and device?
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data, resume content or keys first.
